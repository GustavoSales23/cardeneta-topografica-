<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosagem por Polígono v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html, body { margin:0; height:100%; font-family:Arial, sans-serif; }
  #app { display:flex; flex-direction:column; height:100vh; }
  #topbar { display:flex; flex-wrap:wrap; gap:10px; padding:8px 12px; background:#1b5e20; color:#fff; align-items:center; font-size:14px; }
  #topbar input { padding:5px; }
  #busca { width:260px; }
  #tanque { width:70px; }
  #topbar button { padding:6px 12px; border:0; border-radius:4px; cursor:pointer; background:#fff; color:#1b5e20; font-weight:bold; }
  #main { display:flex; flex:1; min-height:0; }
  #map { flex:1.4; background:#ccc; }
  #side { flex:1; min-width:340px; overflow:auto; padding:10px; background:#fafafa; }
  .card { background:#fff; border:1px solid #ddd; border-left:6px solid #888; border-radius:4px; padding:8px; margin-bottom:10px; }
  .row { display:flex; gap:6px; margin-bottom:5px; align-items:center; flex-wrap:wrap; }
  .card input, .card select { padding:4px; font-size:13px; }
  .nome { font-weight:bold; flex:1; min-width:100px; }
  .prod { flex:1; min-width:100px; }
  .num { width:70px; }
  .btn-del { border:0; background:#c62828; color:#fff; border-radius:3px; cursor:pointer; }
  .area { font-size:13px; color:#555; margin:4px 0; }
  .eq { font-size:1.0em; overflow-x:auto; }
  #totais { background:#e8f5e9; border:2px solid #2e7d32; border-radius:4px; padding:8px; }
  #totais h3, #lista h3 { margin:0 0 6px; font-size:15px; }
  .leaflet-tooltip.rotulo { background:transparent; border:0; box-shadow:none; padding:0; color:#fff; font-weight:bold; font-size:10px;
    text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; pointer-events:none; }
  .leaflet-tooltip.rotulo::before { display:none; }
  body.print-mode .leaflet-tooltip.rotulo { font-size:18px; }
  .verts table { border-collapse:collapse; font-size:11px; width:100%; }
  .verts th, .verts td { border:1px solid #ddd; padding:2px 4px; text-align:right; }
  .vnota { font-size:11px; color:#555; margin-top:3px; }
  details.vd summary { cursor:pointer; font-size:13px; margin:4px 0; }
  #refsys { font-size:12px; color:#333; background:#fff; border:1px solid #ccc; border-radius:4px; padding:8px; margin-top:10px; line-height:1.45; }
  body.print-mode .eq { overflow:visible; }
  #relhead { display:none; }
  @media (max-width:800px) { #main { flex-direction:column; } #map { min-height:45vh; flex:none; } #side { min-width:0; } }

  /* Modo de impressão / PDF */
  body.print-mode, body.print-mode #app { height:auto; }
  body.print-mode #topbar, body.print-mode .leaflet-control-container .leaflet-control-zoom,
  body.print-mode .leaflet-draw, body.print-mode .btn-del { display:none !important; }
  body.print-mode #main { display:block; }
  body.print-mode #map { width:1400px; height:900px; zoom:0.5; flex:none; }
  body.print-mode #side { overflow:visible; min-width:0; background:#fff; padding:6px 0; }
  body.print-mode #relhead { display:block; margin-bottom:8px; }
  body.print-mode .card, body.print-mode #totais { page-break-inside:avoid; }
  body.print-mode .card input, body.print-mode .card select { border:0; background:transparent; font-size:13px; appearance:none; -webkit-appearance:none; }
  @page { margin:12mm; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <input id="busca" placeholder="Endereço ou coordenada (ex: -12.5, -61.0)">
    <button id="btnBusca">Buscar</button>
    <label>Tanque (L) <input id="tanque" type="number" value="600"></label>
    <label title="Maior zoom em que o satélite tem imagem na sua área. Se aparecer 'Map data not yet available', diminua.">Zoom do satélite <input id="znat" type="number" min="10" max="19" value="17" style="width:50px"></label>
    <button id="btnPdf">Exportar PDF</button>
    <span id="status">Carregando...</span>
  </div>
  <div id="main">
    <div id="map"></div>
    <div id="side">
      <div id="relhead">
        <h2 style="margin:0">Relatório de Aplicação — Dosagem por Polígono</h2>
        <div id="relinfo" style="font-size:13px;color:#555"></div>
      </div>
      <div id="lista"><h3>Polígonos</h3><div id="cards"></div></div>
      <div id="totais"><h3>Totais</h3><div id="totaisEq">Desenhe um polígono no mapa (botão no canto esquerdo).</div></div>
      <div id="refsys"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script>
window.addEventListener('load', () => {
  const st = document.getElementById('status');
  const falta = [];
  if (typeof L === 'undefined') falta.push('Leaflet');
  else if (!L.Control || !L.Control.Draw) falta.push('Leaflet.draw');
  if (typeof turf === 'undefined') falta.push('Turf');
  if (typeof katex === 'undefined') falta.push('KaTeX');
  if (falta.length) { st.textContent = 'Falhou ao carregar: ' + falta.join(', '); return; }
  st.textContent = 'Pronto';

  const map = L.map('map').setView([-12.5, -61.0], 7);
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 17, maxZoom: 20, attribution: 'Tiles © Esri'
  }).addTo(map);

  const itens = new L.FeatureGroup().addTo(map);
  map.addControl(new L.Control.Draw({
    draw: { polygon:{ showArea:false }, polyline:false, rectangle:false, circle:false, marker:false, circlemarker:false },
    edit: { featureGroup: itens }
  }));

  const fmt = (n, d=2) => n.toLocaleString('pt-BR', { minimumFractionDigits:d, maximumFractionDigits:d });
  const tex = s => s.replace(/,/g, '{,}');
  const limpa = s => (s || 'Produto').replace(/[\\{}$&#^_%~]/g, ' ');
  const cores = ['#e53935','#1e88e5','#fdd835','#8e24aa','#fb8c00','#00acc1','#d81b60','#7cb342'];
  const polys = {};
  let contador = 0;
  let ultimo = { prod:'Herbicida X', unit:'L', dose:2.5, calda:150 };

  const render = (eq, el) => katex.render(eq, el, { throwOnError:false });
  const numVal = el => parseFloat(el.value) || 0;

  // ---------- Coordenadas: WGS84 -> UTM (elipsoide WGS84/GRS80) ----------
  function utm(lat, lng, zona) {
    const a = 6378137, f = 1/298.257223563, e2 = f*(2-f), ep2 = e2/(1-e2), k0 = 0.9996, r = Math.PI/180;
    const p = lat*r, l0 = ((zona-1)*6 - 180 + 3)*r, dl = lng*r - l0;
    const N = a/Math.sqrt(1 - e2*Math.sin(p)**2), T = Math.tan(p)**2, C = ep2*Math.cos(p)**2, A = dl*Math.cos(p);
    const M = a*((1 - e2/4 - 3*e2**2/64 - 5*e2**3/256)*p - (3*e2/8 + 3*e2**2/32 + 45*e2**3/1024)*Math.sin(2*p)
      + (15*e2**2/256 + 45*e2**3/1024)*Math.sin(4*p) - (35*e2**3/3072)*Math.sin(6*p));
    const e = k0*N*(A + (1-T+C)*A**3/6 + (5-18*T+T**2+72*C-58*ep2)*A**5/120) + 500000;
    let n = k0*(M + N*Math.tan(p)*(A**2/2 + (5-T+9*C+4*C**2)*A**4/24 + (61-58*T+T**2+600*C-330*ep2)*A**6/720));
    if (lat < 0) n += 10000000;
    return { e, n };
  }

  function renderVerts(p, Aturf) {
    const ring = p.layer.getLatLngs()[0];
    const c = turf.centroid(p.layer.toGeoJSON()).geometry.coordinates;
    const zona = Math.floor((c[0] + 180)/6) + 1, hemi = c[1] < 0 ? 'S' : 'N';
    const pts = ring.map(ll => Object.assign({ lat:ll.lat, lng:ll.lng }, utm(ll.lat, ll.lng, zona)));
    let s = 0;
    pts.forEach((a, i) => { const b = pts[(i+1) % pts.length]; s += a.e*b.n - b.e*a.n; });
    const dE = utm(c[1], c[0], zona).e - 500000;
    const k = 0.9996*(1 + Math.pow(dE/(0.9996*6371000), 2)/2);   // fator de escala no centroide
    const Autm = Math.abs(s)/2/(k*k);
    const dif = (Autm - Aturf)/Aturf*100;
    const linhas = pts.map((v, i) => `<tr><td>${i+1}</td><td>${v.lat.toFixed(6)}</td><td>${v.lng.toFixed(6)}</td><td>${v.e.toFixed(2)}</td><td>${v.n.toFixed(2)}</td></tr>`).join('');
    p.q('.verts').innerHTML =
      `<table><tr><th>Pt</th><th>Latitude (°)</th><th>Longitude (°)</th><th>Este (m)</th><th>Norte (m)</th></tr>${linhas}</table>` +
      `<div class="vnota">Graus decimais, datum WGS84 (EPSG:4326). UTM fuso ${zona}${hemi}. ` +
      `Conferência da área pelas coordenadas UTM: ${fmt(Autm,1)} m² (diferença de ${fmt(dif,2)}% em relação ao cálculo acima).</div>`;
    return zona + hemi;
  }

  function atualizaRef(zonas) {
    const z = [...zonas];
    const utmTxt = z.length ? z.map(s => {
      const n = parseInt(s), h = s.slice(-1);
      const sir = (h === 'S' && n >= 18 && n <= 25) ? ` (equivalente SIRGAS 2000 / UTM ${n}S = EPSG:${31960 + n})` : '';
      return `UTM fuso ${n}${h}, datum WGS84 (EPSG:${(h === 'S' ? 32700 : 32600) + n})${sir}`;
    }).join('; ') : 'UTM (o fuso é definido pelo centro de cada polígono)';
    document.getElementById('refsys').innerHTML =
      '<b>Sistema de referência das coordenadas</b><br>' +
      '• Geográficas: latitude/longitude em graus decimais, datum WGS84 (EPSG:4326), o mesmo do GPS. Para uso prático equivale ao SIRGAS 2000 (EPSG:4674); a diferença é decimétrica ou menor.<br>' +
      '• Planas: ' + utmTxt + ', unidade em metros.<br>' +
      '• Área: calculada pelas coordenadas geográficas (Turf, aproximação esférica) e conferida em UTM com correção de escala.<br>' +
      '• <b>Ajuste do GPS/coletor:</b> datum WGS84 (ou SIRGAS 2000), formato graus decimais (ddd.ddddd) ou UTM no mesmo fuso.<br>' +
      '• Os vértices foram marcados sobre imagem de satélite (Esri World Imagery); a precisão posicional é a da imagem e pode haver desvio de alguns metros em relação ao GPS.';
  }

  // ---------- Cartões de polígonos ----------
  function addPoly(layer) {
    const id = L.stamp(layer);
    const cor = cores[contador % cores.length];
    contador++;
    layer.setStyle({ color:cor, fillOpacity:0.25 });

    const card = document.createElement('div');
    card.className = 'card';
    card.style.borderLeftColor = cor;
    card.innerHTML = `
      <div class="row"><input class="nome"><button class="btn-del" title="Remover">✕</button></div>
      <div class="row"><input class="prod" placeholder="Produto">
        <select class="unit"><option>L</option><option>kg</option></select></div>
      <div class="row">
        <label>Dose <input class="num dose" type="number" step="0.01"> <span class="u"></span>/ha</label>
        <label>Calda <input class="num calda" type="number" step="1"> L/ha</label></div>
      <div class="area"></div><div class="eq"></div>
      <details class="vd"><summary>Vértices (coordenadas)</summary><div class="verts"></div></details>`;
    const q = s => card.querySelector(s);
    q('.nome').value = 'Talhão ' + contador;
    q('.prod').value = ultimo.prod;
    q('.unit').value = ultimo.unit;
    q('.dose').value = ultimo.dose;
    q('.calda').value = ultimo.calda;
    document.getElementById('cards').appendChild(card);

    const p = polys[id] = { layer, card, q };
    layer.bindTooltip(q('.nome').value, { permanent:true, direction:'center', className:'rotulo' });

    card.addEventListener('input', () => {
      layer.setTooltipContent(q('.nome').value || '—');
      ultimo = { prod:q('.prod').value, unit:q('.unit').value, dose:numVal(q('.dose')), calda:numVal(q('.calda')) };
      calc();
    });
    q('.btn-del').addEventListener('click', () => removePoly(id));
    calc();
  }

  function removePoly(id) {
    const p = polys[id]; if (!p) return;
    itens.removeLayer(p.layer);
    p.card.remove();
    delete polys[id];
    calc();
  }

  // ---------- Cálculo e equações ----------
  function calc() {
    const tanque = numVal(document.getElementById('tanque'));
    const ids = Object.keys(polys);
    const grupos = {};
    let areaTot = 0, caldaTot = 0;
    const areas = [], caldas = [];
    const zonas = new Set();

    ids.forEach(id => {
      const p = polys[id], q = p.q;
      const A = turf.area(p.layer.toGeoJSON());
      const ha = A / 10000;
      const unit = q('.unit').value;
      const dose = numVal(q('.dose')), calda = numVal(q('.calda'));
      const prod = ha * dose, vc = ha * calda;
      q('.u').textContent = unit;
      q('.area').textContent = 'Área: ' + fmt(A,1) + ' m² = ' + fmt(ha,4) + ' ha';
      render(
        `\\text{Produto} = ${tex(fmt(ha,4))}\\ \\text{ha} \\times ${tex(fmt(dose))}\\ \\tfrac{\\text{${unit}}}{\\text{ha}} = \\mathbf{${tex(fmt(prod))}\\ \\text{${unit}}}\\\\[4pt]` +
        `\\text{Calda} = ${tex(fmt(ha,4))}\\ \\text{ha} \\times ${tex(fmt(calda,0))}\\ \\tfrac{\\text{L}}{\\text{ha}} = \\mathbf{${tex(fmt(vc))}\\ \\text{L}}`,
        q('.eq'));
      areaTot += ha; caldaTot += vc; areas.push(ha); caldas.push(vc);
      zonas.add(renderVerts(p, A));
      const nome = limpa(q('.prod').value.trim());
      const chave = nome + '|' + unit;
      (grupos[chave] = grupos[chave] || { nome, unit, vals:[] }).vals.push(prod);
    });

    atualizaRef(zonas);
    const box = document.getElementById('totaisEq');
    if (!ids.length) { box.textContent = 'Desenhe um polígono no mapa (botão no canto esquerdo).'; return; }
    box.innerHTML = '';
    const soma = (arr, d, suf) => arr.length > 1
      ? arr.map(v => tex(fmt(v,d))).join(' + ') + ' = '
      : '';
    const linhas = [];
    linhas.push(`A_{total} = ${soma(areas,4)}\\mathbf{${tex(fmt(areaTot,4))}\\ \\text{ha}}`);
    Object.values(grupos).forEach(g => {
      const t = g.vals.reduce((a,b)=>a+b,0);
      linhas.push(`\\text{${g.nome}} = ${soma(g.vals,2)}\\mathbf{${tex(fmt(t))}\\ \\text{${g.unit}}}`);
    });
    linhas.push(`\\text{Calda total} = ${soma(caldas,2)}\\mathbf{${tex(fmt(caldaTot))}\\ \\text{L}}`);
    if (tanque > 0) {
      const n = caldaTot / tanque;
      linhas.push(`\\text{Tanques} = ${tex(fmt(caldaTot))}\\ \\text{L} \\div ${tex(fmt(tanque,0))}\\ \\text{L} = \\mathbf{${tex(fmt(n))}} \\ \\Rightarrow\\ ${Math.ceil(n - 1e-9)}\\ \\text{tanque(s)}`);
    }
    linhas.forEach(l => { const d = document.createElement('div'); d.style.margin = '6px 0'; render(l, d); box.appendChild(d); });
  }

  // ---------- Eventos do mapa ----------
  map.on(L.Draw.Event.CREATED, e => { itens.addLayer(e.layer); addPoly(e.layer); });
  map.on(L.Draw.Event.EDITED, calc);
  map.on(L.Draw.Event.EDITVERTEX, calc);
  map.on(L.Draw.Event.DELETED, e => {
    e.layers.eachLayer(l => { const id = L.stamp(l); if (polys[id]) { polys[id].card.remove(); delete polys[id]; } });
    calc();
  });
  document.getElementById('tanque').addEventListener('input', calc);
  document.getElementById('znat').addEventListener('input', e => {
    const v = parseInt(e.target.value);
    if (v >= 10 && v <= 19) { sat.options.maxNativeZoom = v; sat.redraw(); }
  });

  // ---------- Busca por coordenada ou endereço ----------
  let marcador = null;
  async function buscar() {
    const txt = document.getElementById('busca').value.trim();
    if (!txt) return;
    let lat = null, lng = null;
    const t = txt.includes(';') ? txt.replace(/,/g, '.').split(';').join(' ') : txt;
    const m = t.match(/^\s*(-?\d+(?:\.\d+)?)[\s,]+(-?\d+(?:\.\d+)?)\s*$/);
    if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
    try {
      if (lat === null) {
        st.textContent = 'Buscando...';
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(txt));
        const j = await r.json();
        if (!j.length) { st.textContent = 'Endereço não encontrado'; return; }
        lat = parseFloat(j[0].lat); lng = parseFloat(j[0].lon);
      }
      if (Math.abs(lat) > 90 || Math.abs(lng) > 180) { st.textContent = 'Coordenada inválida'; return; }
      map.setView([lat, lng], 16);
      if (marcador) map.removeLayer(marcador);
      marcador = L.marker([lat, lng]).addTo(map);
      st.textContent = 'Local: ' + lat.toFixed(5) + ', ' + lng.toFixed(5);
    } catch (err) { st.textContent = 'Erro na busca (internet?)'; }
  }
  document.getElementById('btnBusca').addEventListener('click', buscar);
  document.getElementById('busca').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

  // ---------- Exportar PDF (impressão do navegador) ----------
  function prepararImpressao() {
    document.body.classList.add('print-mode');
    document.getElementById('relinfo').textContent =
      'Data: ' + new Date().toLocaleDateString('pt-BR') + ' | Tanque: ' + fmt(numVal(document.getElementById('tanque')),0) + ' L';
    document.querySelectorAll('details.vd').forEach(d => d.open = true);
    map.invalidateSize({ animate:false });
    if (itens.getLayers().length) map.fitBounds(itens.getBounds().pad(0.15), { maxZoom:19, animate:false });
  }
  document.getElementById('btnPdf').addEventListener('click', () => {
    if (!Object.keys(polys).length) { st.textContent = 'Desenhe ao menos um polígono'; return; }
    prepararImpressao();
    let feito = false;
    const imprimir = () => { if (feito) return; feito = true; setTimeout(() => window.print(), 500); };
    sat.once('load', imprimir);      // imprime quando os tiles terminam de carregar
    setTimeout(imprimir, 4000);      // garantia caso o evento não dispare
  });
  window.addEventListener('afterprint', () => {
    document.body.classList.remove('print-mode');
    document.querySelectorAll('details.vd').forEach(d => d.open = false);
    setTimeout(() => map.invalidateSize(), 100);
  });

  setTimeout(() => map.invalidateSize(), 300);
});
</script>
</body>
</html>
